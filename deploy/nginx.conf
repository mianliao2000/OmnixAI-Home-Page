server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  location = /health/ready { default_type application/json; alias /usr/share/nginx/html/version.json; add_header Cache-Control "no-store"; }
  location /api/ { return 404; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
